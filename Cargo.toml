[workspace]
resolver = "2"
members = ["src-tauri", "crates/recupere-agent"]
# `src-tauri/fuzz` lives outside the workspace on purpose: it depends on
# `libfuzzer-sys` which only builds on nightly under `cargo fuzz`. Pulling
# it into the main workspace would force every stable build to try to
# compile the fuzz crate. See `docs/fuzzing.md` for the run procedure.
exclude = ["src-tauri/fuzz"]
